---
name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-build:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Docker matrix: `--find-interpreter` builds every interpreter the container ships, so
      # one job per platform is enough. A `python-version` axis here rebuilds and re-uploads
      # identical wheels. The native matrices below need the axis; see `windows-build`.
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x86_64
          - runner: ubuntu-latest
            target: i686-unknown-linux-gnu
            arch: x86
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            arch: aarch64
          - runner: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            arch: armv7
          - runner: ubuntu-latest
            target: s390x-unknown-linux-gnu
            arch: s390x
          - runner: ubuntu-latest
            target: powerpc64le-unknown-linux-gnu
            arch: ppc64le
          - runner: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
            arch: riscv64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist --find-interpreter
          sccache: "true"
          manylinux: auto
          maturin-version: "v1.14.1"
      - name: Upload wheels
        uses: wandalen/wretry.action@v3.8.0
        with:
          action: actions/upload-artifact@v7.0.1
          with: |
            name: wheels-linux-${{ matrix.platform.arch }}
            path: dist
            overwrite: true
          attempt_limit: 3
          attempt_delay: 10000

  musllinux-build:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Same rule as `linux-build`: no `python-version` axis in a docker matrix.
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            arch: x86_64
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist --find-interpreter
          sccache: "true"
          manylinux: musllinux_1_2
          maturin-version: "v1.14.1"
      - name: Upload wheels
        uses: wandalen/wretry.action@v3.8.0
        with:
          action: actions/upload-artifact@v7.0.1
          with: |
            name: wheels-musllinux-${{ matrix.platform.arch }}
            path: dist
            overwrite: true
          attempt_limit: 3
          attempt_delay: 10000

  windows-build:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: windows-latest
            target: x64
          - runner: windows-latest
            target: x86
        # Keep this axis: each leg installs interpreters the runner image does not ship, so
        # dropping it loses those wheels.
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist --find-interpreter
          sccache: "true"
          maturin-version: "v1.14.1"
      - name: Upload wheels
        uses: wandalen/wretry.action@v3.8.0
        with:
          action: actions/upload-artifact@v7.0.1
          with: |
            name: wheels-windows-${{ matrix.platform.target }}-${{ matrix.python-version }}
            path: dist
            overwrite: true
          attempt_limit: 3
          attempt_delay: 10000

  macos-build:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
        # Keep this axis: each leg installs interpreters the runner image does not ship, so
        # dropping it loses those wheels.
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist --find-interpreter
          sccache: "true"
          maturin-version: "v1.14.1"
      - name: Upload wheels
        uses: wandalen/wretry.action@v3.8.0
        with:
          action: actions/upload-artifact@v7.0.1
          with: |
            name: wheels-macos-${{ matrix.platform.target }}-${{ matrix.python-version }}
            path: dist
            overwrite: true
          attempt_limit: 3
          attempt_delay: 10000

  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          maturin-version: "v1.14.1"
      - name: Upload sdist
        uses: wandalen/wretry.action@v3.8.0
        with:
          action: actions/upload-artifact@v7.0.1
          with: |
            name: wheels-sdist
            path: dist
            overwrite: true
          attempt_limit: 3
          attempt_delay: 10000

  unit-tests-linux:
    name: Unit Tests
    needs: [linux-build]
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
            wheel-artifact: wheels-linux-x86_64
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a
      - name: Download the built wheel
        uses: wandalen/wretry.action@v3.8.0
        with:
          action: actions/download-artifact@v8.0.1
          with: |
            name: ${{ matrix.platform.wheel-artifact }}
            path: dist
          attempt_limit: 3
          attempt_delay: 10000
      # Install the wheel this platform built, matched by its double interpreter tag, so a
      # `cp314` job can never take a `cp314t` wheel; combinations with no wheel build from
      # source. Never use `python -m pytest` here: the source tree shadows the wheel.
      - name: Install the release wheel
        shell: bash
        run: |
          uv venv --python "$(command -v python)" .venv
          uv pip install --python .venv pytest
          tag="cp${{ matrix.python-version }}"; tag="${tag/./}"
          wheel="$(ls dist/complexipy-*-"${tag}"-"${tag}"-*.whl 2>/dev/null | head -1 || true)"
          if [[ -n "$wheel" ]]; then
            echo "installing $wheel"
            uv pip install --python .venv "$wheel"
          else
            echo "no ${tag} wheel for this platform; building from source"
            uv pip install --python .venv maturin
            uv run --no-sync maturin develop
          fi
      - name: pytest
        shell: bash
        run: uv run --no-sync pytest
      - name: complexipy execution
        shell: bash
        run: uv run --no-sync complexipy complexipy --failed

  unit-tests-windows:
    name: Unit Tests
    needs: [windows-build]
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            wheel-artifact: wheels-windows-x64
          - runner: windows-latest
            target: x86
            wheel-artifact: wheels-windows-x86
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.platform.target }}
      - name: Install uv
        uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a
      - name: Download the built wheel
        uses: wandalen/wretry.action@v3.8.0
        with:
          action: actions/download-artifact@v8.0.1
          with: |
            name: ${{ matrix.platform.wheel-artifact }}-${{ matrix.python-version }}
            path: dist
          attempt_limit: 3
          attempt_delay: 10000
      # As in `unit-tests-linux`: select the wheel by its double interpreter tag, and never
      # run `python -m pytest`.
      - name: Install the release wheel
        shell: bash
        run: |
          uv venv --python "$(command -v python)" .venv
          uv pip install --python .venv pytest
          tag="cp${{ matrix.python-version }}"; tag="${tag/./}"
          wheel="$(ls dist/complexipy-*-"${tag}"-"${tag}"-*.whl 2>/dev/null | head -1 || true)"
          if [[ -n "$wheel" ]]; then
            echo "installing $wheel"
            uv pip install --python .venv "$wheel"
          else
            echo "no ${tag} wheel for this platform; building from source"
            uv pip install --python .venv maturin
            uv run --no-sync maturin develop
          fi
      - name: pytest
        shell: bash
        run: uv run --no-sync pytest
      - name: complexipy execution
        shell: bash
        run: uv run --no-sync complexipy complexipy --failed

  unit-tests-macos:
    name: Unit Tests
    needs: [macos-build]
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
            wheel-artifact: wheels-macos-x86_64
          - runner: macos-latest
            target: aarch64
            wheel-artifact: wheels-macos-aarch64
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a
      - name: Download the built wheel
        uses: wandalen/wretry.action@v3.8.0
        with:
          action: actions/download-artifact@v8.0.1
          with: |
            name: ${{ matrix.platform.wheel-artifact }}-${{ matrix.python-version }}
            path: dist
          attempt_limit: 3
          attempt_delay: 10000
      # As in `unit-tests-linux`: select the wheel by its double interpreter tag, and never
      # run `python -m pytest`.
      - name: Install the release wheel
        shell: bash
        run: |
          uv venv --python "$(command -v python)" .venv
          uv pip install --python .venv pytest
          tag="cp${{ matrix.python-version }}"; tag="${tag/./}"
          wheel="$(ls dist/complexipy-*-"${tag}"-"${tag}"-*.whl 2>/dev/null | head -1 || true)"
          if [[ -n "$wheel" ]]; then
            echo "installing $wheel"
            uv pip install --python .venv "$wheel"
          else
            echo "no ${tag} wheel for this platform; building from source"
            uv pip install --python .venv maturin
            uv run --no-sync maturin develop
          fi
      - name: pytest
        shell: bash
        run: uv run --no-sync pytest
      - name: complexipy execution
        shell: bash
        run: uv run --no-sync complexipy complexipy --failed

  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [linux-build, musllinux-build, windows-build, macos-build, sdist, unit-tests-windows, unit-tests-linux, unit-tests-macos]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Download artifacts
        uses: wandalen/wretry.action@v3.8.0
        with:
          action: actions/download-artifact@v8.0.1
          with: |
            path: artifacts
            pattern: wheels-*
          attempt_limit: 3
          attempt_delay: 10000
      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p dist
          find artifacts -name '*.whl' -o -name '*.tar.gz' | while read f; do
            mv "$f" dist/
          done
          rm -rf artifacts
      # `.github/expected-wheels.txt` is the gate: a missing expected wheel fails the release
      # before anything is published, and an unexpected wheel warns and proceeds. Add a new
      # platform's wheels to that file only after a release run confirms them.
      - name: Verify the wheel set
        shell: bash
        run: |
          if ! compgen -G 'dist/*.whl' > /dev/null; then
            echo "::error::no wheels found in dist/"
            exit 1
          fi
          if [[ $(ls dist/*.tar.gz 2>/dev/null | wc -l) -ne 1 ]]; then
            echo "::error::expected exactly one sdist in dist/"
            exit 1
          fi
          actual="$(for f in dist/*.whl; do basename "$f" .whl | sed -E 's/^complexipy-[^-]+-//'; done | sort -u)"
          expected="$(grep -vE '^[[:space:]]*(#|$)' .github/expected-wheels.txt | sort -u)"
          missing="$(comm -13 <(printf '%s\n' "$actual") <(printf '%s\n' "$expected"))"
          extra="$(comm -23 <(printf '%s\n' "$actual") <(printf '%s\n' "$expected"))"
          count="$(printf '%s\n' "$actual" | wc -l | tr -d ' ')"
          if [[ -n "$missing" ]]; then
            printf '%s\n' "$missing" | sed 's/^/  missing: /'
            echo "::error::the wheel set is missing $(printf '%s\n' "$missing" | wc -l | tr -d ' ') wheel(s) the expected set requires"
            exit 1
          fi
          if [[ -n "$extra" ]]; then
            printf '%s\n' "$extra" | sed 's/^/  extra: /'
            echo "::warning::the wheel set has $(printf '%s\n' "$extra" | wc -l | tr -d ' ') wheel(s) not in the expected set"
          fi
          echo "wheel set verified: ${count} wheels, none missing"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          attestations: false

  notify-downstream:
    name: Notify downstream repos
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Notify complexipy-pre-commit
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          repository: rohaquinlop/complexipy-pre-commit
          event-type: complexipy-release
          client-payload: '{"version": "${{ steps.version.outputs.version }}"}'
      - name: Notify complexipy-action
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          repository: rohaquinlop/complexipy-action
          event-type: complexipy-release
          client-payload: '{"version": "${{ steps.version.outputs.version }}"}'

  deploy-docs:
    name: Deploy docs
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a
        with:
          python-version: "3.10"
      # `--no-sync` keeps mkdocs from compiling the extension: a bare `uv run` would build the
      # whole workspace just to render the docs.
      - name: Install dev dependencies
        run: uv sync --group dev --no-install-project --frozen
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ hashFiles('mkdocs.yml', 'mkdocs.es.yml') }}
          restore-keys: mkdocs-material-
          path: .cache
      - run: uv run --no-sync mkdocs build
      - run: uv run --no-sync mkdocs build -f mkdocs.es.yml
      - run: uv run --no-sync ghp-import -n -p -f site
