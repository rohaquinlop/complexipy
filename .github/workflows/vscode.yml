---
name: VS Code extension

on:
  push:
    branches: [main]
    paths:
      - vscode/**
      - .github/workflows/vscode.yml
  pull_request:
    paths:
      - vscode/**
      - .github/workflows/vscode.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    name: Lint, test, and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vscode/complexipy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode/complexipy/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      # pretest runs lint again; --ignore-scripts skips it and still runs test.
      - name: Test
        run: npm test --ignore-scripts
      - name: Package
        run: ./node_modules/.bin/vsce package --out complexipy.vsix
