---
name: VS Code extension release

# Tag vscode-vX.Y.Z only after the complexipy release that ships every server
# feature this extension version needs is on PyPI: the extension runs the
# user's installed `complexipy lsp`.
on:
  push:
    tags:
      - vscode-v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    name: Publish to the Marketplace and OpenVSX
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The environment holds VSCE_PAT and is the one the OpenVSX trusted publisher is bound to.
    environment: vscode-marketplace
    # id-token lets ovsx exchange the GitHub OIDC token through the OpenVSX
    # trusted publisher registered for this workflow; no OpenVSX secret exists.
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: vscode/complexipy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode/complexipy/package-lock.json
      - name: Check the tag matches package.json
        run: |
          tag_version="${GITHUB_REF_NAME#vscode-v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} is version ${tag_version}, but package.json is ${package_version}"
            exit 1
          fi
      # vsce and ovsx are locked dev dependencies. Install scripts stay off: packaging and publishing
      # need none of them.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test --ignore-scripts
      - name: Package
        run: ./node_modules/.bin/vsce package --out complexipy.vsix
      # Both registries get the same file; --skip-duplicate makes a rerun after
      # a partial failure publish only where the version is missing.
      - name: Publish to the Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: ./node_modules/.bin/vsce publish --packagePath complexipy.vsix --skip-duplicate
      - name: Publish to OpenVSX
        run: ./node_modules/.bin/ovsx publish complexipy.vsix --trusted-publishing --skip-duplicate
