---
name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize]

# The action reads the pull request through the API, which the repository
# default token denies when it is content-only.
permissions:
  pull-requests: read

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017  # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
