---
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      # The project is skipped on purpose: a bare `uv run` re-syncs and compiles the Rust
      # workspace to type-check Python. Keep `--no-install-project` here and `--no-sync` on
      # every `uv run` below.
      - name: Install dev dependencies
        run: uv sync --group dev --no-install-project --frozen
      - name: Run ruff check
        run: uv run --no-sync ruff check .
      - name: Run ruff format
        run: uv run --no-sync ruff format --check .
      - name: Run ty
        run: uv run --no-sync ty check .

  quick-tests:
    name: Quick Tests
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            python-version: "3.8"
          - runner: ubuntu-latest
            python-version: "3.13"
          - runner: windows-latest
            python-version: "3.8"
          - runner: windows-latest
            python-version: "3.13"
          - runner: macos-latest
            python-version: "3.13"
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      # Each job owns its cache entry: the default key already includes the job name, so do
      # not set `shared-key`. `save-if` keeps pull requests read-only, because a cache written
      # from a pull request is scoped to that branch and no other run can read it.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: pytest
        shell: bash
        run: |
          uv sync --all-extras --frozen --no-install-project
          uv run --no-sync maturin develop
          uv run --no-sync pytest
      - name: complexipy CLI validation
        shell: bash
        run: |-
          uv run --no-sync complexipy complexipy --failed
      - name: complexipy exclude pattern validation
        shell: bash
        run: |-
          uv run --no-sync complexipy tests/src --exclude "exclude_dir/**" --ignore-complexity
          uv run --no-sync complexipy tests/src --exclude "**/test_exclude*.py" --ignore-complexity

  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # As in `quick-tests`: restore on a pull request, write only from `main`.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo test
        run: cargo test --workspace
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo check wasm
        run: cargo check -p complexipy-wasm --target wasm32-unknown-unknown
