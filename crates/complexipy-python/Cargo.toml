[package]
name = "complexipy-python"
description = "The _complexipy pyo3 extension module that the Python package wraps"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
publish = false

[lib]
name = "complexipy"
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[dependencies]
complexipy-core = { path = "../complexipy-core", features = ["python", "runner", "config"] }
complexipy-cli = { path = "../complexipy-cli" }
complexipy-lsp = { path = "../complexipy-lsp" }
complexipy-types = { path = "../complexipy-types", features = ["python"] }
pyo3 = { workspace = true }
clap = { workspace = true }
rayon.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows", all(target_os = "linux", target_arch = "x86_64")))'.dependencies]
mimalloc = "0.1.49"
