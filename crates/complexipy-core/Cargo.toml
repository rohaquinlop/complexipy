[package]
name = "complexipy-core"
description = "Analysis engine: cognitive complexity scoring, diff, refactoring rules, and --fix"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
publish = false

[lib]
name = "complexipy_core"
doctest = false

[features]
default = ["runner"]
runner = ["dep:ignore", "dep:globset", "dep:wax", "dep:rayon"]
python = ["dep:pyo3", "complexipy-types/python"]
wasm = []
config = ["dep:toml"]
schema = ["config", "dep:schemars"]

[dependencies]
complexipy-types = { path = "../complexipy-types" }
ruff_python_parser = { workspace = true }
ruff_python_ast = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
csv = { workspace = true }
ignore = { workspace = true, optional = true }
globset = { workspace = true, optional = true }
wax = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
pyo3 = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
