[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "8.0.0"
edition = "2024"
authors = ["Robin Quintero <rohaquinlop301@gmail.com>"]
license = "MIT"
homepage = "https://github.com/rohaquinlop/complexipy"
documentation = "https://rohaquinlop.github.io/complexipy/"
repository = "https://github.com/rohaquinlop/complexipy"

[workspace.dependencies]
ruff_python_parser = { git = "https://github.com/astral-sh/ruff.git", tag = "0.12.9", package = "ruff_python_parser" }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff.git", tag = "0.12.9", package = "ruff_python_ast" }
regex = "1.11.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3.0"
globset = "0.4"
ignore = "0.4.22"
wax = "0.7.0"
rayon = "1.10"
pyo3 = "0.29"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.4"
console_error_panic_hook = "0.1.7"
toml = "1.1.4"
clap = { version = "4.6.6", features = ["derive"] }
blake2 = "0.10"
sha2 = "0.10"
comfy-table = "8.0"
owo-colors = "4.3"
syntect = "5.3"
terminal_size = "0.4"
unicode-width = "0.2"
tempfile = "3.10.0"
